<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="author" content="Mashari Batahir"><title>Zone Lookup</title>
<style>
:root{--bg:#f3f5f4;--card:#fff;--tx:#14201c;--mu:#5d6b66;--ln:#d5dcd9;--ac:#0b6b57;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101715;--card:#18221f;--tx:#e8efec;--mu:#9aaaa4;--ln:#2c3935;--ac:#4fc3a6;--bad:#ff8a80}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 Tahoma,"Segoe UI",Arial,sans-serif}
main{max-width:980px;margin:auto;padding:16px;display:grid;gap:14px}
h1{font-size:1.4rem;margin:4px 0 0}h2{font-size:1rem;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:10px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,button{font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
input[type=text]{flex:1;min-width:150px}button{background:var(--ac);color:#fff;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
svg{width:100%;height:auto;display:block;border-radius:8px;cursor:crosshair}
#res{font-size:1.05rem}.bad{color:var(--bad)}.mu{color:var(--mu);font-size:.9rem}
.z{display:grid;grid-template-columns:90px 1fr auto;gap:8px;align-items:center;margin-bottom:6px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px}
.cal{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-bottom:6px}
.cal input{width:100%;min-width:0}

const K=Object.keys(Z),NB={n:['ne','w'],ne:['n','se'],se:['ne','s'],s:['se','w'],w:['c','s'],c:['n','e','s','w']};
/* Georeference: map points (pixel x,y) with real coordinates [lat,lng]; a rotation+scale fit is computed from them. */
const ANCH=[{x:312,y:156,ll:[24.7673538,46.6431383]},{x:316,y:228,ll:[24.7266371,46.6667252]},{x:476,y:350,ll:[24.6999337,46.8283044]},{x:207,y:511,ll:[24.518145,46.666509]}];

const KM=(la,lo)=>[(lo-46.66)*111320*Math.cos(24.74*Math.PI/180),-(la-24.74)*110574];
function solve3(N,b){const M=N.map((r,i)=>[...r,b[i]]);for(let i=0;i<3;i++){let p=i;for(let j=i+1;j<3;j++)if(Math.abs(M[j][i])>Math.abs(M[p][i]))p=j;[M[i],M[p]]=[M[p],M[i]];for(let j=0;j<3;j++)if(j!=i){const f=M[j][i]/M[i][i];for(let k=i;k<4;k++)M[j][k]-=f*M[i][k]}}return M.map((r,i)=>r[3]/r[i])}
function mkfit(){const N=[[0,0,0],[0,0,0],[0,0,0]],bx=[0,0,0],by=[0,0,0];
ANCH.forEach(a=>{const q=KM(a.ll[0],a.ll[1]),r=[q[0]/1000,q[1]/1000,1];for(let i=0;i<3;i++){for(let j=0;j<3;j++)N[i][j]+=r[i]*r[j];bx[i]+=r[i]*a.x;by[i]+=r[i]*a.y}});
return{cx:solve3(N,bx),cy:solve3(N,by)}}
let FIT=mkfit();
const $=i=>document.getElementById(i);let pt=null;
const IN=(x,y,p)=>{let r=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>y)!=(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])r=!r}return r};
const DS=(x,y,p)=>{let d=1e9;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[j],b=p[i],dx=b[0]-a[0],dy=b[1]-a[1];let t=((x-a[0])*dx+(y-a[1])*dy)/(dx*dx+dy*dy||1);t=Math.max(0,Math.min(1,t));d=Math.min(d,Math.hypot(x-a[0]-t*dx,y-a[1]-t*dy))}return d};
function zoneAt(x,y){let k=K.find(k=>IN(x,y,Z[k].p));if(k)return k;let b=null,m=30;K.forEach(k=>{const d=DS(x,y,Z[k].p);if(d<m){m=d;b=k}});return b}
const SM={},CE={};K.forEach(k=>{const a=[];for(let x=0;x<635;x+=5)for(let y=0;y<653;y+=5)if(IN(x,y,Z[k].p))a.push([x,y]);SM[k]=a;CE[k]=[a.reduce((s,q)=>s+q[0],0)/a.length,a.reduce((s,q)=>s+q[1],0)/a.length]});
const srt=a=>[...a].sort((x,y)=>x-y);
const bear=(q,c)=>(Math.atan2(q[0]-c[0],-(q[1]-c[1]))*180/Math.PI+45+360)%360;
const TH={};
function cover(k,x,y){const L=NB[k].map(v=>v=='e'?(y<CE.c[1]?'ne':'se'):v);
if(L.length==2){const A=CE[L[0]],B=CE[L[1]],u=[B[0]-A[0],B[1]-A[1]],f=q=>(q[0]-A[0])*u[0]+(q[1]-A[1])*u[1];
if(!TH[k])TH[k]=srt(SM[k].map(f));return f([x,y])<TH[k][TH[k].length>>1]?L[0]:L[1]}
const c=CE[k];if(!TH[k])TH[k]=srt(SM[k].map(q=>bear(q,c)));const t=bear([x,y],c),n=TH[k].length;
return L[t<TH[k][n>>2]?0:t<TH[k][n>>1]?1:t<TH[k][(3*n)>>2]?2:3]}
function draw(){let h='',sel=null,r='Pick a location to see its zone.';
if(pt)sel=zoneAt(pt[0],pt[1]);
K.forEach(k=>{const z=Z[k];h+=`<polygon points="${z.p.map(q=>q.join(',')).join(' ')}" fill="${z.c}" fill-opacity="${k==sel?.28:.1}" stroke="${z.c}" stroke-width="${k==sel?3:1.5}"/>`;
if(k==sel)SM[k].forEach((q,i)=>{if(i%2==0)h+=`<circle cx="${q[0]}" cy="${q[1]}" r="2.4" fill="${Z[cover(k,q[0],q[1])].c}"/>`})});
if(pt)h+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="9" fill="none" stroke="#e11" stroke-width="3"/><circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="#e11"/>`;
$('o').innerHTML=h;
if(pt){if(!sel)r='<span class="bad">This location is outside the defined zones.</span>';else{const c=cover(sel,pt[0],pt[1]);
r=`Primary zone: <b>${Z[sel].t}</b><br><span class="mu">If its owner is absent, this location is covered by: </span><b>${Z[c].t}</b>`}}
$('res').innerHTML=r}
function ll2px(la,lo){const q=KM(la,lo),r=[q[0]/1000,q[1]/1000,1],F=FIT;return[F.cx[0]*r[0]+F.cx[1]*r[1]+F.cx[2],F.cy[0]*r[0]+F.cy[1]*r[1]+F.cy[2]]}
function parse(s){const m=s.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-1632).replace(/[°,;]/g,' ').match(/-?\d+(?:\.\d+)?/g);
if(!m||m.length!=2)return null;const la=+m[0],lo=+m[1];return Math.abs(la)<=90&&Math.abs(lo)<=180?[la,lo]:null}
function search(){const h=$('hint'),c=parse($('ll').value);
if(!c){h.textContent='Enter two numbers: latitude, longitude (for example 24.7136, 46.6753).';return}
const p=ll2px(c[0],c[1]);
if(p[0]<0||p[0]>635||p[1]<0||p[1]>653){h.textContent='These coordinates are outside the map area.';pt=null;draw();return}
h.textContent='Enter latitude and longitude, or tap the map.';pt=p;draw()}
$('go').onclick=search;
$('ll').onkeydown=e=>{if(e.key=='Enter')search()};
$('m').onclick=e=>{const r=$('m').getBoundingClientRect();pt=[(e.clientX-r.left)*635/r.width,(e.clientY-r.top)*653/r.height];draw()};
